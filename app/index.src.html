<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courriers d'honoraires — ALTHO EXPERTISE</title>
<style>
@font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 200 900; font-display: block;
  src: url(data:font/woff2;base64,/*FONT_REGULAR*/) format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-style: italic; font-weight: 400; font-display: block;
  src: url(data:font/woff2;base64,/*FONT_ITALIC*/) format("woff2"); }

:root {
  --desk: oklch(93.5% 0.006 75);
  --desk-deep: oklch(90% 0.008 75);
  --panel: oklch(98.6% 0.003 75);
  --paper: #fff;
  --ink: oklch(23% 0.02 262);
  --ink-2: oklch(40% 0.018 262);
  --ink-3: oklch(50% 0.014 262);
  --rule: oklch(87.5% 0.007 75);
  --rule-soft: oklch(92% 0.005 75);
  --navy: #1f3864;
  --navy-hover: #172b4d;
  --navy-tint: oklch(94.5% 0.022 262);
  --navy-tint-2: oklch(90% 0.035 262);
  --glow: oklch(88% 0.09 85);
  --up: oklch(45% 0.11 150);
  --warn: oklch(52% 0.13 60);
  --warn-tint: oklch(95% 0.045 80);
  --danger: oklch(50% 0.17 27);
  --danger-tint: oklch(95.5% 0.03 27);
  --r-s: 6px;
  --r-m: 8px;
  --shadow-paper: 0 1px 2px oklch(30% 0.02 262 / 0.10), 0 8px 24px oklch(30% 0.02 262 / 0.10), 0 24px 60px oklch(30% 0.02 262 / 0.08);
  --shadow-pop: 0 4px 12px oklch(30% 0.02 262 / 0.14), 0 16px 40px oklch(30% 0.02 262 / 0.12);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  accent-color: var(--navy);
  caret-color: var(--navy);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); }
::selection { background: var(--navy-tint-2); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: oklch(78% 0.01 75) transparent; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barre haute ---------- */
.app { display: grid; grid-template-rows: 56px 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.topbar { display: flex; align-items: center; gap: 28px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; color: var(--navy); white-space: nowrap; }
.brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tab { position: relative; display: flex; align-items: center; padding: 0 14px; border: 0; background: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--navy); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--navy); border-radius: 2px 2px 0 0; }
.tab .count { margin-left: 6px; font-weight: 600; font-size: 12.5px; color: var(--ink-3); }
.topbar .spacer { flex: 1; }
.saved { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--rule); background: var(--paper); font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--rule-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--desk-deep); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-tint); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13.5px; }
.split { display: inline-flex; }
.split .btn.primary:first-child { border-radius: var(--r-s) 0 0 var(--r-s); }
.split .btn.primary.more { border-radius: 0 var(--r-s) var(--r-s) 0; padding: 0 9px; border-left: 1px solid oklch(100% 0 0 / 0.25); }
.menu { position: fixed; inset: auto; margin: 0; padding: 6px; border: 0; border-radius: var(--r-m); background: var(--paper); box-shadow: var(--shadow-pop); min-width: 300px; }
.menu button { display: flex; width: 100%; align-items: flex-start; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: var(--r-s); text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--navy-tint); }
.menu button small { display: block; color: var(--ink-3); font-size: 12.5px; }
.menu button:disabled { opacity: .45; cursor: not-allowed; background: none; }

/* ---------- Vue Courriers : le bureau ---------- */
.view { min-height: 0; }
.desk { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; height: 100%; min-height: 0; }
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--rule); }
.rail-head { padding: 14px 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule-soft); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--ink-3); }
.search input { width: 100%; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--paper); }
.search input::placeholder { color: var(--ink-3); }
.seg { display: flex; padding: 3px; gap: 3px; background: var(--desk); border-radius: var(--r-s); }
.seg button { flex: 1; height: 28px; border: 0; border-radius: 5px; background: none; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--navy); box-shadow: 0 1px 2px oklch(30% 0.02 262 / 0.14); }
.notice { margin: 10px 14px 0; padding: 10px 12px; border-radius: var(--r-s); background: var(--warn-tint); font-size: 13px; color: oklch(35% 0.08 60); }
.notice p { margin: 0 0 8px; }
.notice .row { display: flex; gap: 6px; flex-wrap: wrap; }
.notice .btn { height: 28px; font-size: 12.5px; padding: 0 9px; }
.list { flex: 1; overflow: auto; padding: 6px 8px 8px; }
.item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; width: 100%; padding: 9px 8px; border-radius: var(--r-s); border: 0; background: none; text-align: left; cursor: pointer; }
.item:hover { background: var(--desk); }
.item[aria-current="true"] { background: var(--navy-tint); }
.item input { margin: 0; width: 16px; height: 16px; }
.item .who { min-width: 0; }
.item .who b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item[aria-current="true"] .who b { color: var(--navy); }
.item .who span { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { text-align: right; font-size: 13.5px; font-weight: 600; }
.item .amt span { display: block; font-size: 12px; font-weight: 600; color: var(--up); }
.item.off .who b, .item.off .amt { color: var(--ink-3); }
.empty-list { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.rail-foot { padding: 10px 14px 12px; border-top: 1px solid var(--rule-soft); font-size: 12.5px; color: var(--ink-3); display: grid; gap: 2px; }
.rail-foot b { color: var(--ink); font-weight: 600; }

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-bar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; min-height: 52px; }
.stage-bar .title { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
#stage-chips { display: flex; gap: 6px; flex: none; }
.stage-bar .title span { color: var(--ink-3); font-weight: 400; }
.stage-bar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; font-weight: 600; background: var(--desk-deep); color: var(--ink-2); white-space: nowrap; }
.chip.go { background: var(--navy-tint); color: var(--navy); }
.chip.warn { background: var(--warn-tint); color: oklch(38% 0.1 60); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.toggle input { appearance: none; width: 30px; height: 18px; margin: 0; border-radius: 9px; background: var(--rule); position: relative; transition: background .18s var(--ease); cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px oklch(30% 0.02 262 / 0.3); transition: translate .18s var(--ease); }
.toggle input:checked { background: var(--navy); }
.toggle input:checked::after { translate: 12px 0; }
.stage-scroll { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 6px 24px 32px; }
.sheet-frame { position: relative; flex: none; }
.sheet-frame > .sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: var(--shadow-paper); }
.nav-arrows { display: inline-flex; gap: 2px; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-s); border: 0; background: none; color: var(--ink-2); }
.icon-btn:hover { background: var(--desk-deep); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; background: none; }

/* ---------- Fiche client ---------- */
.card-side { background: var(--panel); border-left: 1px solid var(--rule); overflow: auto; min-height: 0; }
.fiche { padding: 16px 18px 28px; display: grid; gap: 22px; }
.fiche h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.fiche h3 { margin: 0 0 10px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.fields { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 10px; }
.f { display: grid; gap: 4px; grid-column: span 6; min-width: 0; }
.f.s2 { grid-column: span 2; } .f.s3 { grid-column: span 3; } .f.s4 { grid-column: span 4; }
.f label, .f .lab { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea { width: 100%; height: 34px; padding: 0 9px; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--paper); transition: border-color .15s, box-shadow .15s; }
.f textarea { height: auto; padding: 8px 9px; resize: vertical; line-height: 1.45; }
.f input:hover, .f select:hover, .f textarea:hover { border-color: oklch(80% 0.01 75); }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-tint-2); }
.f input.num { text-align: right; }
.f .hint { font-size: 12px; color: var(--ink-3); }
.f .toggle input { width: 30px; height: 18px; padding: 0; border: 0; box-shadow: none; }
.f .toggle { font-size: 14px; color: var(--ink); }
.f.invalid input { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-tint); }
.f .err { font-size: 12px; color: var(--danger); }
.fees { width: 100%; border-collapse: collapse; font-size: 14px; }
.fees th { font-size: 12px; font-weight: 600; color: var(--ink-3); text-align: right; padding: 0 0 6px; }
.fees th:first-child { text-align: left; }
.fees td { padding: 5px 0; border-top: 1px solid var(--rule-soft); vertical-align: middle; }
.fees td.m { font-weight: 600; padding-right: 8px; }
.fees td.m small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.fees td.in { width: 104px; }
.fees td.in input { width: 100%; height: 32px; padding: 0 8px; text-align: right; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--paper); }
.fees td.in input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-tint-2); }
.fees td.out { width: 88px; text-align: right; font-weight: 600; }
.fees td.out small { display: block; font-weight: 600; font-size: 12px; color: var(--up); }
.fees tr.tot td { border-top: 1px solid var(--rule); font-weight: 700; padding-top: 8px; }
.fees tr.tot td.out small { color: var(--up); }
.radios { display: flex; gap: 3px; padding: 3px; background: var(--desk); border-radius: var(--r-s); }
.radios label { flex: 1; position: relative; }
.radios input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.radios span { display: grid; place-items: center; height: 30px; border-radius: 5px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.radios input:checked + span { background: var(--paper); color: var(--navy); box-shadow: 0 1px 2px oklch(30% 0.02 262 / 0.14); }
.radios input:focus-visible + span { outline: 2px solid var(--navy); outline-offset: 1px; }
.fiche-actions { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule-soft); padding-top: 14px; }

/* ---------- La lettre ---------- */
.sheet { width: 210mm; height: 297mm; background: var(--paper); color: #111a2b; position: relative; overflow: hidden;
  font-family: "Source Sans 3", Arial, sans-serif; font-size: 10pt; line-height: 1.34; font-variant-numeric: tabular-nums; }
.sheet .lh { position: absolute; left: 20mm; right: 20mm; top: 12mm; display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 5mm; border-bottom: 0.6mm solid #1f3864; }
.sheet .lh .cab { font-size: 16.5pt; font-weight: 700; color: #1f3864; letter-spacing: 0.02em; line-height: 1.1; margin-bottom: 2mm; }
.sheet .lh .co { font-size: 8.8pt; color: #3a4457; line-height: 1.45; }
.sheet .dest { position: absolute; left: 110mm; top: 52mm; width: 82mm; font-size: 10.6pt; line-height: 1.38; }
.sheet .dest b { font-weight: 700; }
.sheet .refs { position: absolute; left: 20mm; top: 52mm; width: 80mm; font-size: 9.4pt; color: #3a4457; line-height: 1.5; }
.sheet .refs b { color: #111a2b; font-weight: 600; }
.sheet .flow { position: absolute; left: 20mm; right: 20mm; top: 95mm; }
.sheet .objet { font-weight: 700; margin: 0 0 4.5mm; }
.sheet p { margin: 0 0 2.4mm; text-align: justify; hyphens: auto; }
.sheet .salut { margin-bottom: 2.4mm; }
.sheet table { width: 100%; border-collapse: collapse; margin: 1mm 0 1.5mm; font-size: 9.6pt; }
.sheet th { background: #1f3864; color: #fff; font-weight: 600; text-align: right; padding: 1.3mm 2mm; }
.sheet th:first-child { text-align: left; }
.sheet td { padding: 1.1mm 2mm; text-align: right; border-bottom: 0.25mm solid #d7dce5; white-space: nowrap; }
.sheet td:first-child { text-align: left; white-space: normal; }
.sheet tr.total td { font-weight: 700; background: #e3e9f3; border-bottom: 0.3mm solid #1f3864; border-top: 0.3mm solid #1f3864; }
.sheet .mens { font-size: 8.8pt; font-style: italic; color: #3a4457; margin: 0 0 3.5mm; }
.sheet .sign { margin: 4mm 0 0 90mm; }
.sheet .sign b { display: block; }
.sheet .sign i { font-size: 9.4pt; color: #3a4457; }
.sheet .foot { position: absolute; left: 20mm; right: 20mm; bottom: 8mm; padding-top: 2mm; border-top: 0.25mm solid #c9ced8; font-size: 7.4pt; color: #6b7280; text-align: center; line-height: 1.35; }
.sheet .empty-line { color: #9aa3b2; font-style: italic; }
.sheet .window { position: absolute; left: 100mm; top: 47mm; width: 100mm; height: 45mm; border: 0.5mm dashed oklch(55% 0.12 262 / 0.8); border-radius: 2mm; background: oklch(60% 0.1 262 / 0.05); pointer-events: none; }
.sheet .window span { position: absolute; right: 2mm; bottom: 1.4mm; font-size: 7pt; color: oklch(45% 0.1 262); font-weight: 600; }
.sheet .fold { position: absolute; left: 0; width: 5mm; border-top: 0.3mm solid #c9ced8; pointer-events: none; }
.sheet [data-f] { border-radius: 1mm; transition: background-color .18s var(--ease), box-shadow .18s var(--ease); }
.sheet.live [data-f] { cursor: pointer; }
.sheet.live [data-f]:hover { background: oklch(96% 0.03 85); }
.sheet [data-f].hl { background: oklch(93% 0.08 88); box-shadow: 0 0 0 1.2mm oklch(93% 0.08 88); }

/* ---------- Vue Clients ---------- */
.sheetview { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.toolbar .spacer { flex: 1; }
.totals { display: flex; gap: 22px; padding: 12px 20px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.totals b { color: var(--ink); font-weight: 700; font-size: 15px; }
.totals .up { color: var(--up); }
.grid-wrap { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 24px; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13.5px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-m); }
.grid th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 8px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.grid th.r { text-align: right; }
.grid th:first-child { border-top-left-radius: var(--r-m); }
.grid th:last-child { border-top-right-radius: var(--r-m); }
.grid td { padding: 3px 3px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
.grid tr:last-child td { border-bottom: 0; }
.grid tr:hover td { background: oklch(97.5% 0.004 75); }
.grid td input, .grid td select { height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: 5px; background: none; width: 100%; }
.grid td input:hover, .grid td select:hover { border-color: var(--rule); }
.grid td input:focus, .grid td select:focus { outline: none; border-color: var(--navy); background: var(--paper); box-shadow: 0 0 0 3px var(--navy-tint-2); }
.grid td input.num { text-align: right; }
.grid td.calc { text-align: right; font-weight: 600; padding: 0 8px; }
.grid td.calc small { color: var(--up); font-weight: 600; margin-left: 4px; }
.grid td.ck { text-align: center; }
.grid td.ck input { width: 16px; height: 16px; }
.grid .tag { font-size: 11.5px; font-weight: 600; color: oklch(40% 0.1 60); background: var(--warn-tint); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.grid-empty { max-width: 560px; margin: 56px auto; text-align: center; }
.grid-empty h2 { font-size: 20px; margin: 0 0 6px; }
.grid-empty p { color: var(--ink-2); margin: 0 0 18px; }
.grid-empty .row { display: flex; gap: 8px; justify-content: center; }

/* ---------- Vue Réglages ---------- */
.settings { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); height: 100%; min-height: 0; }
.settings-form { overflow: auto; background: var(--panel); border-right: 1px solid var(--rule); }
.settings-form section { padding: 20px 24px 22px; border-bottom: 1px solid var(--rule-soft); }
.settings-form h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.settings-form .lead { margin: 0 0 14px; font-size: 13px; color: var(--ink-3); }
.pct { position: relative; }
.pct input { padding-right: 26px; }
.pct::after { content: "%"; position: absolute; right: 10px; top: 50%; translate: 0 -50%; font-size: 13px; color: var(--ink-3); pointer-events: none; }
.eur::after { content: "€"; }
.balises { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.balises code { font-family: inherit; font-size: 12.5px; font-weight: 600; background: var(--desk); padding: 2px 7px; border-radius: 4px; color: var(--ink-2); }
.settings .stage-scroll { padding-top: 18px; }

/* ---------- Dialogue et toast ---------- */
dialog { border: 0; border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow-pop); color: var(--ink); }
dialog::backdrop { background: oklch(25% 0.02 262 / 0.35); }
dialog .d-body { padding: 22px 24px 8px; }
dialog h2 { margin: 0 0 8px; font-size: 18px; }
dialog p { margin: 0 0 10px; color: var(--ink-2); }
dialog ul { margin: 0 0 12px; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
dialog .d-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 20px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; border-radius: var(--r-m); background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--shadow-pop); z-index: 50; max-width: calc(100vw - 32px); }
.toast .btn { height: 30px; background: transparent; color: #fff; border-color: oklch(100% 0 0 / 0.3); }
.toast .btn:hover { background: oklch(100% 0 0 / 0.1); }

/* ---------- Écrans étroits ---------- */
@media (max-width: 1180px) {
  .desk { grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: auto; }
  .card-side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); }
  .desk { overflow: auto; height: 100%; }
  .stage { min-height: 70vh; }
  .settings { grid-template-columns: 1fr; overflow: auto; }
  .settings-form { overflow: visible; border-right: 0; }
}
@media (max-width: 760px) {
  .app { grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
  .topbar { flex-wrap: wrap; gap: 8px 14px; padding: 10px 16px 0; }
  .tabs { order: 3; width: 100%; height: 42px; overflow-x: auto; }
  .topbar .saved { display: none; }
  .topbar .split { margin-left: auto; }
  .topbar .split .label-long { display: none; }
  .desk { display: block; height: auto; overflow: visible; }
  .rail { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 46vh; }
  .stage { min-height: 0; }
  .stage-bar { flex-wrap: wrap; padding: 10px 16px; }
  .stage-scroll { padding: 4px 16px 20px; overflow: hidden; }
  .toolbar, .totals { padding-left: 16px; padding-right: 16px; }
  .grid-wrap { padding: 0 16px 20px; }
  .settings-form section { padding: 18px 16px; }
  .f.s2, .f.s3, .f.s4 { grid-column: span 6; }
  .fields .f.s2.keep { grid-column: span 2; }
  .fields .f.s4.keep { grid-column: span 4; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Impression ---------- */
#print-root { display: none; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { background: #fff; height: auto; }
  .app, dialog, .toast, .menu { display: none !important; }
  #print-root { display: block; }
  #print-root .sheet { break-after: page; page-break-after: always; box-shadow: none; }
  #print-root .sheet:last-child { break-after: auto; page-break-after: auto; }
  .sheet .window, .sheet [data-f].hl { background: none !important; box-shadow: none !important; }
}
</style>

<script>
"use strict";
/* ================================================================== données */
const STORE_KEY = "altho-courriers-v1";
const MISSIONS = [
  { k: "compta", tx: "compta" },
  { k: "paye", tx: "paye" },
  { k: "jur", tx: "jur" },
  { k: "pa", tx: "pa" },
];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function defaultSettings() {
  const y = new Date().getFullYear();
  return {
    cabNom: "ALTHO EXPERTISE",
    cabAdr1: "141 rue Charles de Gaulle",
    cabCPVille: "95130 LE PLESSIS-BOUCHARD",
    cabVille: "Le Plessis-Bouchard",
    cabContact: "Tél. 01 34 14 53 45 · altho@altho-experts.com · altho-experts.com",
    cabMentions: "ALTHO EXPERTISE · SAS au capital de 10 000 € · RCS Pontoise 919 706 325 · TVA FR62919706325 · Société d'expertise comptable inscrite au Tableau de l'Ordre des experts-comptables de Paris Île-de-France",
    signataire: "",
    signataireTitre: "Expert-comptable",
    dateCourrier: "",
    dateEffet: `${y + 1}-01-01`,
    taux: { compta: 3.5, paye: 4, jur: 3, pa: 0 },
    arrondi: 1,
    echeances: 12,
    tva: 20,
    lib: {
      compta: "Mission comptable (tenue, révision, bilan, liasse fiscale)",
      paye: "Mission sociale (bulletins de paie, DSN, déclarations sociales)",
      jur: "Mission juridique (approbation des comptes, secrétariat juridique)",
      pa: "Plateforme agréée – facturation électronique",
    },
    txt: {
      objet: "Objet : révision de nos honoraires au {date_effet}",
      p1: "Nous tenons tout d'abord à vous remercier pour la confiance que vous accordez à {cabinet}. Comme chaque année, et conformément aux dispositions de votre lettre de mission, nous procédons à la révision de nos honoraires.",
      p2: "Cette révision, que nous avons souhaitée mesurée, tient compte de l'évolution de nos charges (rémunération et formation continue de nos collaborateurs, logiciels, sécurité informatique) ainsi que du renforcement constant des obligations comptables, fiscales, sociales et juridiques qui s'imposent à votre entreprise.",
      p3: "L'année à venir est également marquée par la généralisation de la facturation électronique : depuis le 1er septembre 2026, toutes les entreprises doivent être en mesure de recevoir leurs factures électroniques via une plateforme agréée, et l'obligation d'émission s'étendra aux PME et micro-entreprises au 1er septembre 2027. Notre cabinet vous accompagne dans cette transition grâce à une solution de plateforme agréée directement intégrée à votre dossier.",
      p4: "À compter du {date_effet}, vos honoraires annuels hors taxes évolueront ainsi (évolution globale : {hausse}) :",
      p5: "Les autres conditions de votre lettre de mission demeurent inchangées. Les nouveaux montants seront appliqués automatiquement sur vos prochaines factures et échéances de prélèvement.",
      p6: "Votre interlocuteur habituel reste à votre entière disposition pour répondre à vos questions et faire le point sur l'évolution de vos besoins.",
      politesse: "Nous vous prions d'agréer, {civilite}, l'expression de nos salutations distinguées.",
    },
  };
}
function demoClients() {
  return [
    { code: "C001", civ: "M.", prenom: "Pierre", nom: "DURAND", societe: "SARL DURAND BÂTIMENT", adr1: "5 avenue des Tilleuls", adr2: "", cp: "95120", ville: "Ermont", email: "p.durand@exemple.fr", compta: 3600, paye: 1800, jur: 600, pa: 240, tauxPerso: null, envoyer: true, mode: "courrier" },
    { code: "C002", civ: "Mme", prenom: "Sophie", nom: "LEROY", societe: "SAS LEROY CONSEIL", adr1: "Parc d'activités des Bellevues", adr2: "Bât. B – 3 allée Verte", cp: "95610", ville: "Éragny", email: "s.leroy@exemple.fr", compta: 5400, paye: 0, jur: 900, pa: 0, tauxPerso: 2.5, envoyer: true, mode: "email" },
    { code: "C003", civ: "", prenom: "", nom: "", societe: "EURL LES JARDINS DE CLAIRE", adr1: "18 chemin des Vignes", adr2: "", cp: "95130", ville: "Franconville", email: "contact@jardins-claire.fr", compta: 2400, paye: 1200, jur: 0, pa: 180, tauxPerso: null, envoyer: true, mode: "deux" },
  ].map(c => ({ ...c, id: uid(), exemple: true }));
}
function uid() { return Math.random().toString(36).slice(2, 10); }
function blankClient(code) {
  return { id: uid(), code, civ: "", prenom: "", nom: "", societe: "", adr1: "", adr2: "", cp: "", ville: "", email: "", compta: 0, paye: 0, jur: 0, pa: 0, tauxPerso: null, envoyer: true, mode: "courrier", exemple: false };
}

let state = load();
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { data = null; }
  const base = { settings: defaultSettings(), clients: demoClients(), selectedId: null };
  if (!data || !Array.isArray(data.clients)) { base.selectedId = base.clients[0].id; return base; }
  const d = defaultSettings();
  const s = data.settings || {};
  const settings = { ...d, ...s, taux: { ...d.taux, ...(s.taux || {}) }, lib: { ...d.lib, ...(s.lib || {}) }, txt: { ...d.txt, ...(s.txt || {}) } };
  const clients = data.clients.map(c => ({ ...blankClient(""), ...c }));
  return { settings, clients, selectedId: data.selectedId && clients.some(c => c.id === data.selectedId) ? data.selectedId : (clients[0] || {}).id || null };
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const el = document.getElementById("saved");
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      el.innerHTML = '<svg class="i"><use href="#i-check"/></svg>Enregistré sur cet ordinateur';
      el.style.color = "";
    } catch (e) {
      el.textContent = "Non enregistré : faites une sauvegarde (Réglages)";
      el.style.color = "var(--danger)";
    }
  }, 250);
}

/* ================================================================== calculs */
const fmtEur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmtEur2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const eur = v => fmtEur.format(v || 0);
function pctSigned(r) { return (r > 0 ? "+" : r < 0 ? "−" : "") + fmtPct.format(Math.abs(r) * 100) + " %"; }
function dec(v) { return v === "" || v == null ? "" : String(v).replace(".", ","); }
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v == null) return 0;
  const s = String(v).replace(/[\s  €]/g, "").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function tauxFor(c, m) {
  const t = c.tauxPerso != null && c.tauxPerso !== "" ? num(c.tauxPerso) : num(state.settings.taux[m]);
  return t / 100;
}
function nouveau(c, m) {
  const act = num(c[m]);
  if (act <= 0) return 0;
  const step = Math.max(num(state.settings.arrondi), 0.01);
  const raw = Math.round(act * (1 + tauxFor(c, m)) * 100) / 100;
  return Math.ceil((raw - 0.005) / step) * step;
}
function totals(c) {
  let a = 0, n = 0;
  for (const m of MISSIONS) { a += num(c[m.k]); n += nouveau(c, m.k); }
  return { a, n, d: n - a, r: a ? n / a - 1 : 0 };
}
function inPrint(c, kind) {
  if (!c.envoyer) return false;
  if (kind === "tous") return true;
  if (kind === "poste") return c.mode !== "email";
  if (kind === "email") return c.mode !== "courrier";
  return false;
}
function dateTexte(iso) {
  const d = iso ? new Date(iso + "T12:00:00") : new Date();
  if (isNaN(d)) return "";
  const j = d.getDate();
  return `${j}${j === 1 ? "er" : ""} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}
function civLongue(c) { return c.civ === "Mme" ? "Madame" : c.civ === "M." ? "Monsieur" : "Madame, Monsieur"; }

/* ================================================================== rendu de la lettre */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
function balises(txt, c, t) {
  const S = state.settings;
  const map = { cabinet: S.cabNom, societe: c.societe, date_effet: dateTexte(S.dateEffet), hausse: t.a ? pctSigned(t.r).replace(/^\+/, "") : "—", civilite: civLongue(c) };
  return esc(txt || "").replace(/\{(cabinet|societe|date_effet|hausse|civilite)\}/g, (_, k) => esc(map[k]));
}
function letterHTML(c, opts = {}) {
  const S = state.settings, t = totals(c);
  const ph = label => opts.live ? `<span class="empty-line">${label}</span>` : "";
  const attn = [c.civ, c.prenom, c.nom].filter(Boolean).join(" ");
  const cpVille = [c.cp, (c.ville || "").toUpperCase()].filter(Boolean).join(" ");
  const rows = MISSIONS.filter(m => num(c[m.k]) > 0 || nouveau(c, m.k) > 0).map(m => {
    const a = num(c[m.k]), n = nouveau(c, m.k);
    return `<tr data-f="m-${m.k}"><td>${esc(S.lib[m.k])}</td><td>${eur(a)}</td><td>${a ? pctSigned(n / a - 1) : "—"}</td><td>${eur(n)}</td><td>${n - a ? eur(n - a) : "—"}</td></tr>`;
  }).join("");
  const ech = Math.round(num(S.echeances));
  const mens = ech > 0 && t.n > 0
    ? `<p class="mens">Soit ${fmtEur2.format(t.n / ech)} € HT par échéance (${ech} échéances), ${fmtEur2.format(t.n / ech * (1 + num(S.tva) / 100))} € TTC.</p>` : "";
  const para = k => (S.txt[k] || "").trim() ? `<p data-f="t-${k}">${balises(S.txt[k], c, t)}</p>` : "";
  const window = opts.window ? '<div class="window"><span>Fenêtre d\'enveloppe DL (100 × 45 mm)</span></div>' : "";
  const folds = opts.window ? '<div class="fold" style="top:99mm"></div><div class="fold" style="top:198mm"></div>' : "";
  return `<article class="sheet${opts.live ? " live" : ""}" data-id="${esc(c.id)}">
    ${window}${folds}
    <header class="lh">
      <div><div class="cab" data-f="s-cab">${esc(S.cabNom)}</div>
        <div class="co" data-f="s-cab">${esc(S.cabAdr1)}<br>${esc(S.cabCPVille)}<br>${esc(S.cabContact)}</div></div>
    </header>
    <div class="refs"><div data-f="s-date">${esc(S.cabVille)}, le ${esc(dateTexte(S.dateCourrier))}</div><div data-f="code">Réf. client : <b>${esc(c.code || "—")}</b></div></div>
    <div class="dest">
      <div data-f="societe"><b>${c.societe ? esc(c.societe) : ph("Société")}</b></div>
      ${attn && c.nom ? `<div data-f="contact">À l'attention de ${esc(attn)}</div>` : ""}
      <div data-f="adr1">${c.adr1 ? esc(c.adr1) : ph("Adresse")}</div>
      ${c.adr2 ? `<div data-f="adr2">${esc(c.adr2)}</div>` : ""}
      <div data-f="cpville">${cpVille ? esc(cpVille) : ph("Code postal et ville")}</div>
    </div>
    <div class="flow">
      <p class="objet" data-f="t-objet">${balises(S.txt.objet, c, t)}</p>
      <p class="salut" data-f="civ">${esc(civLongue(c))},</p>
      ${para("p1")}${para("p2")}${para("p3")}${para("p4")}
      <table data-f="fees"><thead><tr><th>Mission</th><th>Actuel HT</th><th>Évol.</th><th>Nouveau HT</th><th>Écart HT</th></tr></thead>
        <tbody>${rows || (opts.live ? '<tr><td colspan="5" class="empty-line">Aucune mission : saisissez les honoraires actuels.</td></tr>' : "")}
        <tr class="total"><td>Total annuel HT</td><td>${eur(t.a)}</td><td>${t.a ? pctSigned(t.r) : "—"}</td><td>${eur(t.n)}</td><td>${t.d ? eur(t.d) : "—"}</td></tr></tbody></table>
      ${mens}
      ${para("p5")}${para("p6")}${para("politesse")}

/* Place une feuille A4 dans un cadre, à l'échelle de l'espace disponible */
function mountSheet(frame, scroller, html) {
  frame.innerHTML = html;
  const sheet = frame.firstElementChild;
  fitSheet(frame, scroller);
  return sheet;
}
function fitSheet(frame, scroller) {
  const sheet = frame.firstElementChild;
  if (!sheet) return;
  const W = sheet.offsetWidth, H = sheet.offsetHeight;
  const cs = getComputedStyle(scroller);
  const availW = scroller.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = scroller.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  let s = narrow ? availW / W : Math.min(availW / W, Math.max(availH, 480) / H);
  s = Math.max(0.25, Math.min(s, 1.25));
  sheet.style.transform = `scale(${s})`;
  frame.style.width = W * s + "px";
  frame.style.height = H * s + "px";
}
function overflowOf(sheet) {
  const flow = sheet.querySelector(".flow"), foot = sheet.querySelector(".foot");
  return flow.offsetTop + flow.offsetHeight > foot.offsetTop - 4;
}

function nextCode() {
  let max = 0;
  for (const c of state.clients) { const m = /^C(\d+)$/i.exec(c.code || ""); if (m) max = Math.max(max, +m[1]); }
  return "C" + String(max + 1).padStart(3, "0");
}
function addClient() {
  const c = blankClient(nextCode());
  state.clients.push(c); state.selectedId = c.id; save();
  filter = "tous"; search = ""; $("#search").value = "";
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x.dataset.filter === "tous"));
  show("courriers");

}
function removeClient(id) {

  const [c] = state.clients.splice(i, 1);

  save(); show(view);

let toastTimer = null;
function toast(msg, actionLabel, action) {

  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");

function printClients(list, title, checked) {

  if (!checked) {
    const issues = [];
    if (!state.settings.signataire.trim()) issues.push("Le nom du signataire n'est pas renseigné (Réglages).");
    const noAddr = list.filter(c => !c.societe || !c.adr1 || !c.cp || !c.ville);
    if (noAddr.length) issues.push(`${noAddr.length} courrier${noAddr.length > 1 ? "s ont" : " a"} une adresse incomplète : ${noAddr.slice(0, 4).map(c => esc(c.societe || c.code || "sans nom")).join(", ")}${noAddr.length > 4 ? "…" : ""}.`);
    const noFee = list.filter(c => totals(c).a <= 0);
    if (noFee.length) issues.push(`${noFee.length} courrier${noFee.length > 1 ? "s n'ont" : " n'a"} aucun honoraire saisi : ${noFee.slice(0, 4).map(c => esc(c.societe || c.code || "sans nom")).join(", ")}${noFee.length > 4 ? "…" : ""}.`);
    if (issues.length) {
      showDialog(`<div class="d-body"><h2>À vérifier avant d'imprimer</h2><ul>${issues.map(i => `<li>${i}</li>`).join("")}</ul><p>${list.length} courrier${list.length > 1 ? "s" : ""} prêt${list.length > 1 ? "s" : ""} à imprimer.</p></div>
        <div class="d-actions"><button class="btn quiet" data-close>Annuler</button>${!state.settings.signataire.trim() ? '<button class="btn" data-imp="settings">Renseigner le signataire</button>' : ""}<button class="btn primary" data-imp="print">Imprimer quand même</button></div>`,
        b => { if (b.dataset.imp === "print") printClients(list, title, true); if (b.dataset.imp === "settings") { show("reglages"); const f = $("#s-signataire"); if (f) f.focus(); } });

let fileMode = "import";
$("#file-input").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    if (fileMode === "restore") return restore(await file.text());
    const rows = /\.xlsx$/i.test(file.name) ? await readXlsx(await file.arrayBuffer()) : readCsv(await decodeText(await file.arrayBuffer()));
    const res = mapRows(rows);
    confirmImport(file.name, res);
  } catch (err) {
    showDialog(`<div class="d-body"><h2>Ce fichier n'a pas pu être lu</h2><p>${esc(err.message || String(err))}</p><p>Enregistrez-le depuis Excel au format « Classeur Excel (.xlsx) » ou « CSV UTF-8 », avec une ligne d'en-têtes (Société, Adresse, Code postal, Ville, Compta…), puis réessayez.</p></div><div class="d-actions"><button class="btn primary" data-close>Compris</button></div>`);
  }
});
async function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  let t = new TextDecoder("utf-8").decode(u8);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(u8);
  return t.replace(/^﻿/, "");
}
function readCsv(text) {
  const first = text.split(/\r?\n/)[0] || "";
  const delim = [";", "\t", ","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
/* Lecteur .xlsx minimal : zip + XML, sans bibliothèque externe */
async function readXlsx(buf) {
  const files = await unzip(buf, n => /^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(n));

  const wb = xml(files["xl/workbook.xml"] || ""), rels = xml(files["xl/_rels/workbook.xml.rels"] || "");
  const sheets = [...wb.getElementsByTagName("sheet")].map(s => ({ name: s.getAttribute("name"), rid: s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") }));
  if (!sheets.length) throw new Error("Aucune feuille trouvée dans le classeur.");
  const pick = sheets.find(s => norm(s.name) === "clients") || sheets.find(s => !/param|mode d|courrier|impression|macro/i.test(norm(s.name))) || sheets[0];
  const rel = [...rels.getElementsByTagName("Relationship")].find(r => r.getAttribute("Id") === pick.rid);
  let target = rel ? rel.getAttribute("Target") : "worksheets/sheet1.xml";
  target = target.replace(/^\/?xl\//, "").replace(/^\//, "");
  const sheetXml = files["xl/" + target];
  if (!sheetXml) throw new Error("La feuille « " + pick.name + " » est introuvable.");
  const shared = files["xl/sharedStrings.xml"] ? [...xml(files["xl/sharedStrings.xml"]).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const doc = xml(sheetXml), rows = [];
  for (const r of doc.getElementsByTagName("row")) {
    const out = [];
    for (const cEl of r.getElementsByTagName("c")) {
      const ref = cEl.getAttribute("r") || "", col = colIndex(ref.replace(/\d+/g, ""));
      const tp = cEl.getAttribute("t"), vEl = cEl.getElementsByTagName("v")[0];
      let v = "";
      if (tp === "s") v = shared[+(vEl ? vEl.textContent : 0)] ?? "";
      else if (tp === "inlineStr") v = [...cEl.getElementsByTagName("t")].map(t => t.textContent).join("");
      else if (tp === "b") v = vEl && vEl.textContent === "1" ? "Oui" : "Non";
      else v = vEl ? vEl.textContent : "";
      out[col >= 0 ? col : out.length] = v;
    }
    rows.push(Array.from(out, x => x ?? ""));
  }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
function colIndex(s) { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }
async function unzip(buf, want) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Ce fichier n'est pas un classeur Excel valide.");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const out = {}, dec = new TextDecoder("utf-8");
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (!want(name)) continue;
    const lnlen = dv.getUint16(off + 26, true), lelen = dv.getUint16(off + 28, true);
    const data = u8.subarray(off + 30 + lnlen + lelen, off + 30 + lnlen + lelen + csize);
    if (method === 0) out[name] = dec.decode(data);
    else if (method === 8) {
      if (typeof DecompressionStream === "undefined") throw new Error("Ce navigateur ne sait pas lire les fichiers .xlsx. Utilisez Chrome ou Edge à jour, ou enregistrez le fichier en CSV.");
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      out[name] = dec.decode(await new Response(stream).arrayBuffer());
    }
  }
  return out;
}
/* Reconnaissance des colonnes par leur en-tête */
const HEADS = [
  ["code", ["codeclient", "code", "ref", "refclient", "reference", "numeroclient", "nclient", "noclient", "numero"]],
  ["civ", ["civilite", "civ", "titre"]],
  ["prenom", ["prenom", "prenomcontact"]],
  ["nom", ["nom", "nomcontact", "contact", "nomdudirigeant", "dirigeant"]],
  ["societe", ["societe", "raisonsociale", "entreprise", "denomination", "client", "nomsociete", "nomclient", "dossier", "nomdelasociete", "nomdelentreprise", "nomdudossier"]],
  ["adr1", ["adresse1", "adresse", "adresseligne1", "rue", "voie"]],
  ["adr2", ["adresse2", "complement", "complementadresse", "adresseligne2", "complementdadresse"]],
  ["cp", ["codepostal", "cp"]],
  ["ville", ["ville", "commune", "localite"]],
  ["email", ["email", "mail", "courriel", "adressemail", "adresseemail"]],
  ["compta", ["comptaactuelht", "comptaactuel", "compta", "comptabilite", "honorairescompta", "missioncomptable", "honorairescomptables"]],
  ["paye", ["payeactuelht", "payeactuel", "paye", "paie", "social", "honorairespaye", "missionsociale"]],
  ["jur", ["juridiqueactuelht", "juridiqueactuel", "juridique", "jur", "honorairesjuridique", "missionjuridique"]],
  ["pa", ["paactuelht", "paactuel", "pa", "plateforme", "plateformeagreee", "facturationelectronique"]],
  ["tauxPerso", ["tauxpersooptionnel", "tauxperso", "tauxparticulier", "taux"]],
  ["envoyer", ["aenvoyer", "envoyer", "envoi"]],
  ["mode", ["modedenvoi", "mode", "modeenvoi"]],
];
function mapRows(rows) {
  if (!rows.length) throw new Error("Le fichier est vide.");
  let hi = rows.findIndex(r => r.filter(v => matchHead(v)).length >= 2);
  if (hi < 0) throw new Error("Aucune ligne d'en-têtes reconnue (par exemple « Société », « Adresse », « Code postal », « Ville »).");
  const cols = {}; rows[hi].forEach((h, i) => { const k = matchHead(h); if (k && cols[k] == null) cols[k] = i; });
  if (cols.societe == null && cols.nom == null) throw new Error("Il manque une colonne « Société » (ou « Nom »).");
  const found = HEADS.map(([k]) => k).filter(k => cols[k] != null);
  const clients = []; let skipped = 0;
  const mapped = Object.values(cols);
  for (const r of rows.slice(hi + 1)) {
    const g = k => cols[k] == null ? "" : String(r[cols[k]] ?? "").trim();
    if (!g("societe") && !g("nom")) { if (mapped.some(i => String(r[i] ?? "").trim() !== "" && String(r[i]).trim() !== "0")) skipped++; continue; }
    const c = blankClient(g("code"));
    for (const k of ["civ", "prenom", "nom", "societe", "adr1", "adr2", "ville", "email"]) c[k] = g(k);
    c.cp = g("cp").replace(/\.0$/, ""); if (/^\d{4}$/.test(c.cp)) c.cp = "0" + c.cp;
    c.civ = /^(mme|madame)$/i.test(c.civ) ? "Mme" : /^(m|m\.|mr|monsieur)$/i.test(c.civ) ? "M." : /et/i.test(c.civ) ? "M. et Mme" : "";
    if (!c.societe) c.societe = [c.prenom, c.nom].filter(Boolean).join(" ");
    for (const k of ["compta", "paye", "jur", "pa"]) c[k] = Math.max(0, Math.round(num(g(k)) * 100) / 100);
    const tp = g("tauxPerso"); c.tauxPerso = tp === "" ? null : (num(tp) <= 1 ? Math.round(num(tp) * 1000) / 10 : num(tp));
    const env = norm(g("envoyer")); c.envoyer = env === "" ? true : !/^(non|n|0|false|faux)$/.test(env);
    const mode = norm(g("mode")); c.mode = /deux|2/.test(mode) ? "deux" : /mail/.test(mode) ? "email" : "courrier";
    clients.push(c);
  }
  return { clients, skipped, found };
}
function matchHead(h) {
  const n = norm(h).replace(/[^a-z0-9]/g, "");
  if (!n || n.includes("nouveau") || n.includes("total") || n.includes("ecart") || n.includes("impression")) return null;
  for (const [k, syn] of HEADS) if (syn.includes(n)) return k;
  for (const [k, syn] of HEADS) if (syn.some(s => s.length > 3 && n.startsWith(s))) return k;
  return null;
}
const LABELS = { code: "Réf. client", civ: "Civilité", prenom: "Prénom", nom: "Nom", societe: "Société", adr1: "Adresse", adr2: "Complément", cp: "Code postal", ville: "Ville", email: "E-mail", compta: "Comptabilité", paye: "Paye", jur: "Juridique", pa: "Plateforme agréée", tauxPerso: "Taux particulier", envoyer: "À envoyer", mode: "Mode d'envoi" };
function confirmImport(name, res) {

  showDialog(`<div class="d-body"><h2>${res.clients.length} client${res.clients.length > 1 ? "s" : ""} trouvé${res.clients.length > 1 ? "s" : ""}</h2>
    <p>Dans « ${esc(name)} ». Colonnes reconnues : ${res.found.map(k => esc(LABELS[k])).join(", ")}.</p>
    ${missing.length ? `<p>Colonnes d'honoraires absentes : ${missing.map(k => esc(LABELS[k])).join(", ")}. Ces montants seront à 0 : vous pourrez les saisir ensuite.</p>` : ""}
    ${res.skipped ? `<p>${res.skipped} ligne${res.skipped > 1 ? "s" : ""} sans société ni nom ignorée${res.skipped > 1 ? "s" : ""}.</p>` : ""}
    ${hasReal ? "<p>Vous avez déjà des clients. Que faire de la liste actuelle ?</p>" : "<p>Les clients d'exemple seront retirés.</p>"}</div>
    <div class="d-actions"><button class="btn quiet" data-close>Annuler</button>
    ${hasReal ? '<button class="btn" data-imp="add">Ajouter à ma liste</button><button class="btn primary" data-imp="replace">Remplacer ma liste</button>' : '<button class="btn primary" data-imp="replace">Importer</button>'}</div>`,
    btn => {
      const mode = btn.dataset.imp; if (!mode) return;
      const base = mode === "add" ? state.clients.filter(c => !c.exemple) : [];
      let n = 0;
      for (const c of res.clients) { if (!c.code) c.code = "C" + String(base.length + (++n)).padStart(3, "0"); }
      state.clients = base.concat(res.clients); state.selectedId = res.clients[0].id; save();
      show("clients"); toast(`${res.clients.length} client${res.clients.length > 1 ? "s" : ""} importé${res.clients.length > 1 ? "s" : ""}. Vérifiez les montants avant d'imprimer.`);
    });
}
function showDialog(html, onClick) {
  const d = $("#dialog"); d.innerHTML = html;
  d.onclick = e => {
    if (e.target === d || e.target.closest("[data-close]")) { d.close(); return; }
    const b = e.target.closest("button"); if (b && onClick) { onClick(b); if (b.dataset.imp) d.close(); }
  };
  d.showModal();
}

/* ----- export CSV (ouvre dans Excel) et sauvegarde */
function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV() {
  const H = ["Code client", "Civilité", "Prénom", "Nom", "Société", "Adresse 1", "Adresse 2", "Code postal", "Ville", "Email", "Compta actuel HT", "Paye actuel HT", "Juridique actuel HT", "PA actuel HT", "Taux perso", "Compta nouveau HT", "Paye nouveau HT", "Juridique nouveau HT", "PA nouveau HT", "Total actuel HT", "Total nouveau HT", "À envoyer", "Mode d'envoi"];
  const cell = v => { const s = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [H.join(";")].concat(state.clients.map(c => {
    const t = totals(c);
    return [c.code, c.civ, c.prenom, c.nom, c.societe, c.adr1, c.adr2, c.cp, c.ville, c.email, num(c.compta), num(c.paye), num(c.jur), num(c.pa), c.tauxPerso ?? "",
      nouveau(c, "compta"), nouveau(c, "paye"), nouveau(c, "jur"), nouveau(c, "pa"), t.a, t.n, c.envoyer ? "Oui" : "Non", { courrier: "Courrier", email: "Email", deux: "Les deux" }[c.mode]].map(cell).join(";");
  }));
  download(`Clients_honoraires_${new Date().toISOString().slice(0, 10)}.csv`, "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
function backup() {
  download(`Sauvegarde_courriers_${safeName(state.settings.cabNom)}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "altho-courriers", version: 1, ...state }, null, 1), "application/json");
  toast("Copie de sécurité enregistrée dans vos Téléchargements.");
}
function restore(text) {
  let data; try { data = JSON.parse(text); } catch (e) { throw new Error("Ce fichier n'est pas une copie de sécurité de l'application."); }
  if (!data || !Array.isArray(data.clients)) throw new Error("Ce fichier n'est pas une copie de sécurité de l'application.");
  showDialog(`<div class="d-body"><h2>Restaurer cette copie ?</h2><p>${data.clients.length} client${data.clients.length > 1 ? "s" : ""}. La liste et les réglages actuels seront remplacés.</p></div>
    <div class="d-actions"><button class="btn quiet" data-close>Annuler</button><button class="btn primary" data-imp="restore">Restaurer</button></div>`, b => {
    if (b.dataset.imp !== "restore") return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* stockage indisponible */ }
    const prev = state; state = (() => { const d = defaultSettings(), s = data.settings || {}; const clients = data.clients.map(c => ({ ...blankClient(""), ...c })); return { settings: { ...d, ...s, taux: { ...d.taux, ...(s.taux || {}) }, lib: { ...d.lib, ...(s.lib || {}) }, txt: { ...d.txt, ...(s.txt || {}) } }, clients, selectedId: (clients[0] || {}).id || null }; })();
    save(); show(view); toast("Copie restaurée.", "Annuler", () => { state = prev; save(); show(view); });
  });
}

/* ================================================================== démarrage */
const ro = new ResizeObserver(() => {
  if (view === "courriers") fitSheet($("#sheet-frame"), $("#stage-scroll"));
  if (view === "reglages") fitSheet($("#settings-frame"), $("#settings-scroll"));
});
ro.observe($("#stage-scroll")); ro.observe($("#settings-scroll"));
document.fonts && document.fonts.ready.then(() => show(view));
show("courriers");
</script>
