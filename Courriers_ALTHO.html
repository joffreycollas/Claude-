:root {
  --desk: oklch(93.5% 0.006 75);
  --desk-deep: oklch(90% 0.008 75);
  --panel: oklch(98.6% 0.003 75);
  --paper: #fff;
  --ink: oklch(21% 0.006 30);
  --ink-2: oklch(38% 0.008 30);
  --ink-3: oklch(48% 0.008 30);
  --rule: oklch(87.5% 0.007 75);
  --rule-soft: oklch(92% 0.005 75);
  --brand: #9d202e;
  --brand-hover: #7c1823;
  --brand-tint: oklch(95.5% 0.018 18);
  --brand-tint-2: oklch(90.5% 0.042 18);
  --up: oklch(45% 0.11 150);
  --warn-tint: oklch(95% 0.045 80);
  --danger: oklch(50% 0.17 27);
  --danger-tint: oklch(95.5% 0.03 27);
  --r-s: 6px;
  --r-m: 8px;
  --shadow-paper: 0 1px 2px oklch(28% 0.01 30 / 0.10), 0 8px 24px oklch(28% 0.01 30 / 0.10), 0 24px 60px oklch(28% 0.01 30 / 0.08);
  --shadow-pop: 0 4px 12px oklch(28% 0.01 30 / 0.14), 0 16px 40px oklch(28% 0.01 30 / 0.12);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  font-family: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  accent-color: var(--brand);
  caret-color: var(--brand);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); }
::selection { background: var(--brand-tint-2); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: oklch(78% 0.01 75) transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barre haute ---------- */
.app { display: grid; grid-template-rows: 56px 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.topbar { display: flex; align-items: center; gap: 28px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 12px; line-height: 1.1; min-width: 0; }
.brand img { height: 30px; width: auto; display: block; }
.brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tab { position: relative; display: flex; align-items: center; padding: 0 14px; border: 0; background: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--brand); border-radius: 2px 2px 0 0; }
.tab .count { margin-left: 6px; font-weight: 600; font-size: 12.5px; color: var(--ink-3); }
.topbar .spacer { flex: 1; }
.saved { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--rule); background: var(--paper); font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--rule-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--desk-deep); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-tint); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13.5px; }
.split { display: inline-flex; }
.label-short { display: none; }
.split .btn.primary:first-child { border-radius: var(--r-s) 0 0 var(--r-s); }
.split .btn.primary.more { border-radius: 0 var(--r-s) var(--r-s) 0; padding: 0 9px; border-left: 1px solid oklch(100% 0 0 / 0.25); }
.menu { position: fixed; inset: auto; margin: 0; padding: 6px; border: 0; border-radius: var(--r-m); background: var(--paper); box-shadow: var(--shadow-pop); min-width: 300px; }
.menu button { display: flex; width: 100%; align-items: flex-start; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: var(--r-s); text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--brand-tint); }
.menu button small { display: block; color: var(--ink-3); font-size: 12.5px; }
.menu button:disabled { opacity: .45; cursor: not-allowed; background: none; }

/* ---------- Vue Courriers : le bureau ---------- */
.view { min-height: 0; }
.desk { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; height: 100%; min-height: 0; }
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--rule); }
.rail-head { padding: 14px 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule-soft); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--ink-3); }
.search input { width: 100%; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--paper); }
.search input::placeholder { color: var(--ink-3); }
.seg { display: flex; padding: 3px; gap: 3px; background: var(--desk); border-radius: var(--r-s); }
.seg button { flex: 1; height: 28px; border: 0; border-radius: 5px; background: none; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--brand); box-shadow: 0 1px 2px oklch(28% 0.01 30 / 0.14); }
.notice { margin: 10px 14px 0; padding: 10px 12px; border-radius: var(--r-s); background: var(--warn-tint); font-size: 13px; color: oklch(35% 0.08 60); }
.notice p { margin: 0 0 8px; }
.notice .row { display: flex; gap: 6px; flex-wrap: wrap; }
.notice .btn { height: 28px; font-size: 12.5px; padding: 0 9px; }
.list { flex: 1; overflow: auto; padding: 6px 8px 8px; }
.item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; width: 100%; padding: 9px 8px; border-radius: var(--r-s); border: 0; background: none; text-align: left; cursor: pointer; }
.item:hover { background: var(--desk); }
.item[aria-current="true"] { background: var(--brand-tint); }
.item input { margin: 0; width: 16px; height: 16px; }
.item .who { min-width: 0; }

let state = load();
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { data = null; }
  const base = { settings: defaultSettings(), clients: demoClients(), selectedId: null };
  if (!data || !Array.isArray(data.clients)) { base.selectedId = base.clients[0].id; return base; }
  const d = defaultSettings();
  const s = data.settings || {};
  const settings = { ...d, ...s, lib: { ...d.lib, ...(s.lib || {}) }, txt: { ...d.txt, ...(s.txt || {}) } };
  if (/\{hausse\}/.test(settings.txt.p4 || "")) settings.txt.p4 = d.txt.p4; /* ancienne version : taux calculés */
  const clients = data.clients.map(c => ({ ...blankClient(""), ...c }));
  return { settings, clients, selectedId: data.selectedId && clients.some(c => c.id === data.selectedId) ? data.selectedId : (clients[0] || {}).id || null };
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const el = document.getElementById("saved");
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      el.innerHTML = '<svg class="i"><use href="#i-check"/></svg>Enregistré sur cet ordinateur';
      el.style.color = "";
    } catch (e) {
      el.textContent = "Non enregistré : faites une sauvegarde (Réglages)";
      el.style.color = "var(--danger)";
    }
  }, 250);
}

/* ================================================================== calculs */
const fmtEur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmtEur2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const eur = v => fmtEur.format(v || 0);

function dec(v) { return v === "" || v == null ? "" : String(v).replace(".", ","); }
function num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v == null) return 0;
  const s = String(v).replace(/[\s  €]/g, "").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function amt(c, m) { return Math.max(0, num(c[m])); }
function totals(c) {
  let n = 0;
  for (const m of MISSIONS) n += amt(c, m.k);
  return { n };
}
function inPrint(c, kind) {
  if (!c.envoyer) return false;
  if (kind === "tous") return true;
  if (kind === "poste") return c.mode !== "email";
  if (kind === "email") return c.mode !== "courrier";
  return false;
}
function dateTexte(iso) {
  const d = iso ? new Date(iso + "T12:00:00") : new Date();
  if (isNaN(d)) return "";
  const j = d.getDate();
  return `${j}${j === 1 ? "er" : ""} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}
function civLongue(c) { return c.civ === "Mme" ? "Madame" : c.civ === "M." ? "Monsieur" : "Madame, Monsieur"; }

/* ================================================================== rendu de la lettre */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const sup = html => html.replace(/\b1er\b/g, "1<sup>er</sup>");
function balises(txt, c, t) {
  const S = state.settings;
  const map = { cabinet: S.cabNom, societe: c.societe, date_effet: dateTexte(S.dateEffet), hausse: "", civilite: civLongue(c) };
  return sup(esc(txt || "").replace(/\{(cabinet|societe|date_effet|hausse|civilite)\}/g, (_, k) => esc(map[k])));
}
function letterHTML(c, opts = {}) {
  const S = state.settings, t = totals(c);
  const ph = label => opts.live ? `<span class="empty-line">${label}</span>` : "";
  const attn = [c.civ, c.prenom, c.nom].filter(Boolean).join(" ");
  const cpVille = [c.cp, (c.ville || "").toUpperCase()].filter(Boolean).join(" ");
  const rows = MISSIONS.filter(m => amt(c, m.k) > 0).map(m =>
    `<tr data-f="m-${m.k}"><td>${esc(S.lib[m.k])}</td><td>${eur(amt(c, m.k))}</td></tr>`).join("");
  const ech = Math.round(num(S.echeances));
  const mens = ech > 0 && t.n > 0
    ? `<p class="mens">Soit ${fmtEur2.format(t.n / ech)} € HT par échéance (${ech} échéances), ${fmtEur2.format(t.n / ech * (1 + num(S.tva) / 100))} € TTC.</p>` : "";
  const para = k => (S.txt[k] || "").trim() ? `<p data-f="t-${k}">${balises(S.txt[k], c, t)}</p>` : "";
  const window = opts.window ? '<div class="window"><span>Fenêtre d\'enveloppe DL (100 × 45 mm)</span></div>' : "";
  const folds = opts.window ? '<div class="fold" style="top:99mm"></div><div class="fold" style="top:198mm"></div>' : "";
  return `<article class="sheet${opts.live ? " live" : ""}" data-id="${esc(c.id)}">
    ${window}${folds}
    <img class="lh" src="${IMG.entete}" alt="">
    <div class="refs"><div data-f="s-date">${esc(S.cabVille)}, le ${sup(esc(dateTexte(S.dateCourrier)))}</div><div data-f="code">Réf. client : <b>${esc(c.code || "—")}</b></div></div>
    <div class="dest">
      <div data-f="societe"><b>${c.societe ? esc(c.societe) : ph("Société")}</b></div>
      ${attn && c.nom ? `<div data-f="contact">À l'attention de ${esc(attn)}</div>` : ""}
      <div data-f="adr1">${c.adr1 ? esc(c.adr1) : ph("Adresse")}</div>
      ${c.adr2 ? `<div data-f="adr2">${esc(c.adr2)}</div>` : ""}
      <div data-f="cpville">${cpVille ? esc(cpVille) : ph("Code postal et ville")}</div>
    </div>
    <div class="flow">
      <p class="objet" data-f="t-objet">${balises(S.txt.objet, c, t)}</p>
      <p class="salut" data-f="civ">${esc(civLongue(c))},</p>
      ${para("p1")}${para("p2")}${para("p3")}${para("p4")}
      <table data-f="fees"><thead><tr><th>Mission</th><th>Honoraires annuels HT</th></tr></thead>
        <tbody>${rows || (opts.live ? '<tr><td colspan="2" class="empty-line">Aucune mission : saisissez les honoraires du client.</td></tr>' : "")}
        <tr class="total"><td>Total annuel HT</td><td>${eur(t.n)}</td></tr></tbody></table>
      ${mens}
      ${para("p5")}${para("p6")}${para("politesse")}
      <div class="sign" data-f="s-sign"><b>${S.signataire ? esc(S.signataire) : ph("Nom du signataire")}</b><i>${esc(S.signataireTitre)}</i></div>
    </div>
    <img class="pied" src="${IMG.pied}" alt="">

/* Place une feuille A4 dans un cadre, à l'échelle de l'espace disponible */
function mountSheet(frame, scroller, html) {
  frame.innerHTML = html;
  const sheet = frame.firstElementChild;
  fitSheet(frame, scroller);
  return sheet;
}
function fitSheet(frame, scroller) {
  const sheet = frame.firstElementChild;
  if (!sheet) return;
  const W = sheet.offsetWidth, H = sheet.offsetHeight;
  const cs = getComputedStyle(scroller);
  const availW = scroller.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = scroller.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  let s = narrow ? availW / W : Math.min(availW / W, Math.max(availH, 480) / H);
  s = Math.max(0.25, Math.min(s, 1.25));
  if (zoomReal && frame.id === "sheet-frame" && !narrow) s = 1;
  sheet.style.transform = `scale(${s})`;
  frame.style.width = W * s + "px";
  frame.style.height = H * s + "px";
}
function overflowOf(sheet) {
  const flow = sheet.querySelector(".flow"), foot = sheet.querySelector(".pied");
  return flow.offsetTop + flow.offsetHeight > foot.offsetTop - 4;
}

  const u8 = new Uint8Array(buf);

  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(u8);
  return t.replace(/^﻿/, "");
}
function readCsv(text) {
  const first = text.split(/\r?\n/)[0] || "";
  const delim = [";", "\t", ","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
/* Lecteur .xlsx minimal : zip + XML, sans bibliothèque externe */
async function readXlsx(buf) {

  if (!sheets.length) throw new Error("Aucune feuille trouvée dans le classeur.");
  const pick = sheets.find(s => norm(s.name) === "clients") || sheets.find(s => !/param|mode d|courrier|impression|macro/i.test(norm(s.name))) || sheets[0];
  const rel = [...rels.getElementsByTagName("Relationship")].find(r => r.getAttribute("Id") === pick.rid);
  let target = rel ? rel.getAttribute("Target") : "worksheets/sheet1.xml";
  target = target.replace(/^\/?xl\//, "").replace(/^\//, "");
  const sheetXml = files["xl/" + target];
  if (!sheetXml) throw new Error("La feuille « " + pick.name + " » est introuvable.");
  const shared = files["xl/sharedStrings.xml"] ? [...xml(files["xl/sharedStrings.xml"]).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const doc = xml(sheetXml), rows = [];

    for (const cEl of r.getElementsByTagName("c")) {
      const ref = cEl.getAttribute("r") || "", col = colIndex(ref.replace(/\d+/g, ""));
      const tp = cEl.getAttribute("t"), vEl = cEl.getElementsByTagName("v")[0];
      let v = "";
      if (tp === "s") v = shared[+(vEl ? vEl.textContent : 0)] ?? "";
      else if (tp === "inlineStr") v = [...cEl.getElementsByTagName("t")].map(t => t.textContent).join("");
      else if (tp === "b") v = vEl && vEl.textContent === "1" ? "Oui" : "Non";
      else v = vEl ? vEl.textContent : "";
      out[col >= 0 ? col : out.length] = v;

    rows.push(Array.from(out, x => x ?? ""));

}

async function unzip(buf, want) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Ce fichier n'est pas un classeur Excel valide.");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const out = {}, dec = new TextDecoder("utf-8");
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (!want(name)) continue;
    const lnlen = dv.getUint16(off + 26, true), lelen = dv.getUint16(off + 28, true);
    const data = u8.subarray(off + 30 + lnlen + lelen, off + 30 + lnlen + lelen + csize);
    if (method === 0) out[name] = dec.decode(data);
    else if (method === 8) {
      if (typeof DecompressionStream === "undefined") throw new Error("Ce navigateur ne sait pas lire les fichiers .xlsx. Utilisez Chrome ou Edge à jour, ou enregistrez le fichier en CSV.");
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      out[name] = dec.decode(await new Response(stream).arrayBuffer());
    }
  }
  return out;
}
/* Reconnaissance des colonnes par leur en-tête */
const HEADS = [
  ["code", ["codeclient", "code", "ref", "refclient", "reference", "numeroclient", "nclient", "noclient", "numero"]],
  ["civ", ["civilite", "civ", "titre"]],
  ["prenom", ["prenom", "prenomcontact"]],
  ["nom", ["nom", "nomcontact", "contact", "nomdudirigeant", "dirigeant"]],
  ["societe", ["societe", "raisonsociale", "entreprise", "denomination", "client", "nomsociete", "nomclient", "dossier", "nomdelasociete", "nomdelentreprise", "nomdudossier"]],
  ["adr1", ["adresse1", "adresse", "adresseligne1", "rue", "voie"]],
  ["adr2", ["adresse2", "complement", "complementadresse", "adresseligne2", "complementdadresse"]],
  ["cp", ["codepostal", "cp"]],
  ["ville", ["ville", "commune", "localite"]],
  ["email", ["email", "mail", "courriel", "adressemail", "adresseemail"]],
  ["compta", ["comptabiliteht", "comptaht", "compta", "comptabilite", "honorairescompta", "missioncomptable", "honorairescomptables"]],
  ["paye", ["payeht", "paieht", "paye", "paie", "social", "honorairespaye", "missionsociale"]],
  ["jur", ["juridiqueht", "juridique", "jur", "honorairesjuridique", "missionjuridique"]],
  ["pa", ["plateformeagreeeht", "paht", "panouveauht", "paactuelht", "panouveau", "paactuel", "pa", "plateforme", "plateformeagreee", "facturationelectronique"]],
  ["envoyer", ["aenvoyer", "envoyer", "envoi"]],
  ["mode", ["modedenvoi", "mode", "modeenvoi"]],
];
function mapRows(rows) {
  if (!rows.length) throw new Error("Le fichier est vide.");
  let hi = rows.findIndex(r => r.filter(v => matchHead(v)).length >= 2);
  if (hi < 0) throw new Error("Aucune ligne d'en-têtes reconnue (par exemple « Société », « Adresse », « Code postal », « Ville »).");
  const cols = {}, prio = {};
  rows[hi].forEach((h, i) => {
    const k = matchHead(h); if (!k) return;
    const pr = /nouveau/.test(norm(h)) ? 2 : 1; /* ancien classeur : « Compta nouveau HT » l'emporte sur « actuel » */
    if (cols[k] == null || pr > prio[k]) { cols[k] = i; prio[k] = pr; }
  });
  if (cols.societe == null && cols.nom == null) throw new Error("Il manque une colonne « Société » (ou « Nom »).");
  const found = HEADS.map(([k]) => k).filter(k => cols[k] != null);
  const clients = []; let skipped = 0;
  const mapped = Object.values(cols);
  for (const r of rows.slice(hi + 1)) {
    const g = k => cols[k] == null ? "" : String(r[cols[k]] ?? "").trim();
    if (g("email") === "p.durand@exemple.fr" && g("societe") === "SARL DURAND BÂTIMENT") { continue; } /* ligne d'exemple du modèle */
    if (!g("societe") && !g("nom")) { if (mapped.some(i => String(r[i] ?? "").trim() !== "" && String(r[i]).trim() !== "0")) skipped++; continue; }
    const c = blankClient(g("code"));
    for (const k of ["civ", "prenom", "nom", "societe", "adr1", "adr2", "ville", "email"]) c[k] = g(k);
    c.cp = g("cp").replace(/\.0$/, ""); if (/^\d{4}$/.test(c.cp)) c.cp = "0" + c.cp;
    c.civ = /^(mme|madame)$/i.test(c.civ) ? "Mme" : /^(m|m\.|mr|monsieur)$/i.test(c.civ) ? "M." : /et/i.test(c.civ) ? "M. et Mme" : "";
    if (!c.societe) c.societe = [c.prenom, c.nom].filter(Boolean).join(" ");
    for (const k of ["compta", "paye", "jur", "pa"]) c[k] = Math.max(0, Math.round(num(g(k)) * 100) / 100);
    const env = norm(g("envoyer")); c.envoyer = env === "" ? true : !/^(non|n|0|false|faux)$/.test(env);
    const mode = norm(g("mode")); c.mode = /deux|2/.test(mode) ? "deux" : /mail/.test(mode) ? "email" : "courrier";
    clients.push(c);
  }
  return { clients, skipped, found };
}
function matchHead(h) {
  const n = norm(h).replace(/[^a-z0-9]/g, "");
  if (!n || n.includes("total") || n.includes("ecart") || n.includes("impression") || n.includes("taux")) return null;
  for (const [k, syn] of HEADS) if (syn.includes(n)) return k;
  for (const [k, syn] of HEADS) if (syn.some(s => s.length > 3 && n.startsWith(s))) return k;
  return null;
}

/* ----- export CSV (ouvre dans Excel) et sauvegarde */
function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV() {
  const H = ["Réf. client", "Civilité", "Prénom", "Nom", "Société", "Adresse", "Complément d'adresse", "Code postal", "Ville", "E-mail", "Comptabilité HT", "Paye HT", "Juridique HT", "Plateforme agréée HT", "À envoyer", "Mode d'envoi", "Total HT"];
  const cell = v => { const s = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [H.join(";")].concat(state.clients.map(c => [c.code, c.civ, c.prenom, c.nom, c.societe, c.adr1, c.adr2, c.cp, c.ville, c.email,
    amt(c, "compta"), amt(c, "paye"), amt(c, "jur"), amt(c, "pa"), c.envoyer ? "Oui" : "Non", { courrier: "Courrier", email: "Email", deux: "Les deux" }[c.mode], totals(c).n].map(cell).join(";")));

function downloadModele() {
  const bin = atob(MODELE_XLSX), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  download("Modele_import_clients_ALTHO.xlsx", u8, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Modèle enregistré dans vos Téléchargements. Remplissez-le puis importez-le ici.");
}
function backup() {
  download(`Sauvegarde_courriers_${safeName(state.settings.cabNom)}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "altho-courriers", version: 1, ...state }, null, 1), "application/json");
  toast("Copie de sécurité enregistrée dans vos Téléchargements.");
}
function restore(text) {
  let data; try { data = JSON.parse(text); } catch (e) { throw new Error("Ce fichier n'est pas une copie de sécurité de l'application."); }
  if (!data || !Array.isArray(data.clients)) throw new Error("Ce fichier n'est pas une copie de sécurité de l'application.");
  showDialog(`<div class="d-body"><h2>Restaurer cette copie ?</h2><p>${data.clients.length} client${data.clients.length > 1 ? "s" : ""}. La liste et les réglages actuels seront remplacés.</p></div>
    <div class="d-actions"><button class="btn quiet" data-close>Annuler</button><button class="btn primary" data-imp="restore">Restaurer</button></div>`, b => {
    if (b.dataset.imp !== "restore") return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* stockage indisponible */ }
    const prev = state; state = (() => { const d = defaultSettings(), s = data.settings || {}; const clients = data.clients.map(c => ({ ...blankClient(""), ...c })); const txt = { ...d.txt, ...(s.txt || {}) }; if (/\{hausse\}/.test(txt.p4 || "")) txt.p4 = d.txt.p4; return { settings: { ...d, ...s, lib: { ...d.lib, ...(s.lib || {}) }, txt }, clients, selectedId: (clients[0] || {}).id || null }; })();
    save(); show(view); toast("Copie restaurée.", "Annuler", () => { state = prev; save(); show(view); });
  });
}

/* ================================================================== démarrage */
const ro = new ResizeObserver(() => {
  if (view === "courriers") fitSheet($("#sheet-frame"), $("#stage-scroll"));
  if (view === "reglages") fitSheet($("#settings-frame"), $("#settings-scroll"));
});
ro.observe($("#stage-scroll")); ro.observe($("#settings-scroll"));
document.fonts && document.fonts.ready.then(() => show(view));
show("courriers");
</script>
</body>
</html>
